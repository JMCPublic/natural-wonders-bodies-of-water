<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ec">
<title>Natural Wonders · Bodies of Water</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#16130f;--muted:#6f685d;--line:#e6e0d4;--accent:#e2552d;--cu:#b8663a;--good:#1f7a4a;--goodbg:#e3f3e9;--bad:#b3261e;--badbg:#fbe6e3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation;font:inherit;color:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:22px 16px 40px}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1;font-size:clamp(32px,5vw,48px)}
h1 small{display:block;font:600 13px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--cu);margin-bottom:6px}
h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:21px;margin:0 0 4px}
.sub{color:var(--muted);font-size:15px;line-height:1.5;margin:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:16px}
.label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 7px}
.label:first-child{margin-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 13px;font-size:14px;font-weight:600;cursor:pointer;text-align:left}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:2px}
@media(hover:hover){.opt:hover{border-color:#bdb4a4}}
.opt.on{background:var(--ink);color:#fff;border-color:var(--ink)}.opt.on small{color:#d9d3c8}
.btn{border:0;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:16px;padding:13px 26px;cursor:pointer}
.btn[disabled]{background:#d8cfc1;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.menuhead{display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap}.menuhead .sub{flex:1;min-width:260px;max-width:560px;margin-bottom:2px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:0 32px}
.foot{color:var(--muted);font-size:12px;margin-top:16px;text-align:center;line-height:1.8}
.lay{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.lay button{border:1px solid var(--line);background:#fff;border-radius:999px;font-size:12px;padding:3px 10px;color:var(--muted);cursor:pointer}
.lay button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* plates */
.plate{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;flex:none;font-family:Cinzel,Copperplate,'Copperplate Gothic Bold',Georgia,serif;font-weight:700;font-size:15px;line-height:1;color:#fff4ea;
 background:radial-gradient(circle at 4px 4px,#6e3517 1px,transparent 1.6px),radial-gradient(circle at calc(100% - 4px) 4px,#6e3517 1px,transparent 1.6px),radial-gradient(circle at 4px calc(100% - 4px),#6e3517 1px,transparent 1.6px),radial-gradient(circle at calc(100% - 4px) calc(100% - 4px),#6e3517 1px,transparent 1.6px),linear-gradient(135deg,#eab48a 0%,#c47746 30%,#97502a 58%,#d08f60 82%,#a85d33 100%);
 border:1px solid #7a3c1c;box-shadow:inset 0 1px 0 rgba(255,236,215,.6),inset 0 -1px 0 rgba(60,25,8,.35),0 1px 2px rgba(60,30,10,.25);text-shadow:0 -1px 0 rgba(70,30,10,.55)}
/* play */
.play{display:flex;flex-direction:column;height:calc(100dvh - 62px);min-height:460px;max-height:920px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top h1{font-size:26px}
.link{background:none;border:0;color:var(--muted);font-size:14px;cursor:pointer;text-decoration:underline;padding:4px}
.prog{display:flex;gap:5px;margin:12px 0 4px}.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}.prog i.done{background:var(--ink)}.prog i.now{background:var(--accent)}
.q{text-align:center;font-family:Fraunces,Georgia,serif;font-size:clamp(20px,2.6vw,27px);font-weight:600;margin:8px 0 10px}
.q em{font-style:normal;color:var(--cu)}
.q span{display:block;font:500 13px Inter,sans-serif;color:var(--muted);margin-top:3px}
.q .note{color:var(--cu);font-size:12px}
.board{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
.mapcard{position:relative;background:#fff;border:2px solid var(--line);border-radius:22px;padding:10px;display:flex;min-height:0}
.mapcard svg{flex:1;min-height:0;width:100%;height:100%}
.cname{position:absolute;top:12px;left:16px;font-family:Fraunces,Georgia,serif;font-weight:800;font-size:22px;pointer-events:none}
.rl{font-family:Inter,sans-serif;font-weight:700;fill:#fff;paint-order:stroke;stroke:#16130f;stroke-linejoin:round}
.rl.ra{fill:#f3c9a6}
.rlp{font-family:Cinzel,Copperplate,Georgia,serif;font-weight:700;fill:#fff4ea}
.rank{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;min-height:0;overflow:auto}
.slots{display:flex;flex-direction:column;gap:7px;margin-top:6px}
.slot{display:flex;align-items:center;gap:12px;border:2px dashed #d9cfbf;border-radius:12px;padding:6px 10px;min-height:46px;cursor:pointer;width:100%;background:#fff;text-align:left}
.slot.fixed{border:2px solid var(--cu);background:#fffaf5;cursor:default}
.slot.full{border-style:solid;border-color:#cfc6b6}
.ord{font:800 16px Fraunces,Georgia,serif;width:34px;color:var(--muted);flex:none}
.fill{display:flex;align-items:center;gap:10px;flex:1;font-size:16px;min-width:0}
.fill b{overflow-wrap:anywhere}
.empty{color:#b3a993;font-size:13px}
.given{margin-left:auto;font-size:10px;font-weight:700;color:var(--cu);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.x{margin-left:auto;color:#b3a993;font-size:13px}
.tray{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.tile{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px 6px 6px;font-weight:600;font-size:15px;cursor:pointer}
.tile.used{opacity:.28;cursor:default}
.rank .btn{margin-top:14px;width:100%}
.kbd{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}
html:not(.desktop) .kbd{display:none}
/* results */
.score{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.big{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:60px;line-height:1}
.surprise{background:#fff6e8;border:1px solid #f1dcb6;border-radius:14px;padding:12px 14px;margin-top:14px;font-size:15px;line-height:1.5}
.rcard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:12px}
.rhd{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px;gap:10px}
.rhd h3{font-family:Fraunces,Georgia,serif;font-size:22px;margin:2px 0 0}
.rs{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:30px}
.rgrid{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:18px;align-items:start}
.mini svg{width:100%;height:auto;display:block;background:#faf8f3;border-radius:12px}
.rr{display:grid;grid-template-columns:34px 28px minmax(0,1fr) 170px;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:6px}
.rb{flex:1;min-width:0}.rn{display:flex;justify-content:space-between;gap:8px;font-size:15px}.rn span{color:var(--muted);font-size:13px;white-space:nowrap}
.bar{height:8px;background:#efe9dc;border-radius:4px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ink);border-radius:4px}.bar i.cu{background:var(--cu)}
.abroad{font-size:12px;color:var(--cu);margin-top:3px}
.st{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;text-align:center;justify-self:stretch;line-height:1.3}
.st.ok{background:var(--goodbg);color:var(--good)}.st.no{background:var(--badbg);color:var(--bad)}.st.gv{background:#fff1e4;color:var(--cu)}
.fact{background:#fff6e8;border:1px solid #f1dcb6;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:8px;line-height:1.45}
.srcline{font-size:12px;color:var(--muted);margin-top:8px}.srcline a{color:var(--cu)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
/* short laptop screens */
@media(max-height:820px){html:not(.phone) .wrap{padding-top:14px;padding-bottom:16px}html:not(.phone) .menuhead h1{font-size:38px}html:not(.phone) .panel.menu{padding:16px 20px}
 html:not(.phone) .menu .label{margin:11px 0 6px}html:not(.phone) .menu .opt{padding:7px 11px;font-size:13px}.play{height:calc(100dvh - 30px)}.slot{min-height:40px;padding:4px 10px}.rank{padding:12px}}
/* phone */
html.phone .wrap{padding:max(12px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom))}
html.phone .menuhead{display:block}html.phone .menuhead .sub{margin-top:8px}
html.phone .menu{display:block}html.phone .opts .opt{flex:1 1 auto;min-height:46px}
html.phone .btn{width:100%;padding:15px}
html.phone .play{height:auto;min-height:0;max-height:none}
html.phone .top h1{font-size:20px}
html.phone .q{font-size:20px}
html.phone .board{display:block}
html.phone .mapcard{height:min(56vh,400px);margin-bottom:10px}
html.phone .rank{overflow:visible;padding:12px}
html.phone .rgrid{grid-template-columns:1fr}
html.phone .rr{grid-template-columns:30px 28px minmax(0,1fr)}html.phone .rr .st{grid-column:3;justify-self:start}
html.phone .big{font-size:50px}
html.phone .row .btn{width:100%}
/* Sources page */
.srcov{position:fixed;inset:0;background:rgba(22,19,15,.45);display:none;z-index:50;overflow:auto;padding:max(16px,env(safe-area-inset-top)) 12px 24px}
.srcov.open{display:block}
.srcbox{max-width:760px;margin:0 auto;background:#fff;border-radius:20px;padding:22px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.25);color:#16130f;font-family:Inter,system-ui,sans-serif}
.srcbox h2{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:28px;margin:0 0 6px}
.srcbox h3{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#6f685d;margin:18px 0 6px}
.srcbox p{font-size:14px;line-height:1.55;margin:6px 0;color:#3d372e}
.srcbox ul{margin:6px 0;padding-left:18px;font-size:14px;line-height:1.6}
.srcbox a{color:#b8663a}
.srcbox .gf{background:#fff6e8;border:1px solid #f1dcb6;border-radius:12px;padding:10px 12px}
.srcbox details{border:1px solid #e6e0d4;border-radius:10px;padding:6px 10px;margin:6px 0}
.srcbox summary{cursor:pointer;font-weight:600;font-size:14px}
.srcbox table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.srcbox td{border-top:1px solid #efe9dc;padding:4px 6px;vertical-align:top}
.srcbox td.n{text-align:right;white-space:nowrap}
.srcx{float:right;border:1.5px solid #16130f;background:#fff;border-radius:999px;padding:6px 14px;font:600 14px Inter,sans-serif;cursor:pointer}
.srclink{background:none;border:0;color:#b8663a;text-decoration:underline;font:inherit;font-size:inherit;cursor:pointer;padding:0}

.board{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.mapcard.rm{padding:0;overflow:hidden;flex:1}
.mapcard.rm > svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.locw{position:absolute;right:10px;bottom:10px;background:#fff;border-radius:8px;padding:4px 4px 2px;box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:10px;color:#6f685d;text-align:center;z-index:2}
.locw svg{width:150px;height:auto;display:block}
.qm{font:800 46px Fraunces,Georgia,serif;fill:#5f6b73;paint-order:stroke;stroke:#d6eaf6;stroke-width:4px}
.hint2{position:absolute;left:14px;top:12px;font-size:13px;color:#6f685d;background:rgba(255,255,255,.92);border-radius:8px;padding:5px 9px;z-index:2}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.choice{display:flex;align-items:center;gap:12px;border:2px solid #e6e0d4;background:#fff;border-radius:12px;padding:9px 12px;font:600 16px Inter,sans-serif;text-align:left;color:#16130f;cursor:pointer;width:100%}
@media(hover:hover){.choice:hover{border-color:#cfc6b6}}
.choice.on{border-color:#b8663a;background:#fffaf5;box-shadow:0 0 0 3px rgba(184,102,58,.15)}
.choice b{font-weight:600;overflow-wrap:anywhere}
.kind{display:inline-block;font:700 11px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#5f6b73;background:#e9f2f8;border:1px solid #c9dbe7;border-radius:999px;padding:3px 9px;margin-left:6px;vertical-align:3px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:#6f685d;margin:8px 0 4px}
.lg{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}.lg.t{background:#d6eaf6;border:1.5px solid #5f6b73}.lg.w{background:#ece9e3;border:1.5px dashed #8a8780}.lg.o{background:#fff;border:1px solid #a8a49c}
.rgrid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.rmap{width:100%;height:auto;display:block;border-radius:12px;border:1px solid #e6e0d4}
.rr2{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:7px 12px;margin-bottom:6px;font-size:15px}
.rr2.ans{background:#eef6fb;border-color:#b9d3e4}
.rr2 .st{font-size:11px}
.lkrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:8px}
.lk{position:relative;border:1px solid #e6e0d4;border-radius:12px;padding:6px;text-align:center;font-size:11px;font-weight:600;background:#fff}
.lk svg{width:100%;height:auto;aspect-ratio:1;display:block}
.lk .plate{position:absolute;top:4px;left:4px;width:22px;height:22px;font-size:12px}
.plabel{font:700 12px Inter,sans-serif;fill:#16130f;paint-order:stroke;stroke:#fff;stroke-width:3.5px;stroke-linejoin:round}
.plabel.ans{font-size:13.5px}
html.phone .mapcard.rm{height:min(52vh,360px);flex:none;margin-bottom:8px}
html.phone .locw svg{width:92px}
html.phone .hint2{font-size:12px}
html.phone .rgrid2{grid-template-columns:1fr}
html.phone .lkrow{gap:4px}html.phone .lk{font-size:9px;padding:3px}html.phone .lk .plate{width:18px;height:18px;font-size:10px}
html.phone .choice{padding:11px 12px;min-height:50px}
html.phone .rank{padding:10px 12px}
html.phone .rank .btn{position:sticky;bottom:max(10px,env(safe-area-inset-bottom));box-shadow:0 6px 18px rgba(0,0,0,.18)}
@media(max-height:820px){.choice{padding:7px 12px;font-size:15px}.choices{gap:6px}}
.opt.na{opacity:.38;cursor:not-allowed}
.gcap{font-size:12px;color:var(--muted);margin:2px 0 6px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

  pr.clipExtent([[-2,-2],[W+2,H+2]]);return pr}
let landWorld=null;
function locator(boxPts,dot){const lp=d3.geoEqualEarth().fitExtent([[2,2],[158,80]],{type:'Sphere'});

  else if(boxPts){const pp=boxPts.map(q=>lp(q)).filter(Boolean);if(pp.length){const xs=pp.map(p=>p[0]),ys=pp.map(p=>p[1]);let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
    if(x1-x0>120){mark=''}else{if(x1-x0<6){const m=(x0+x1)/2;x0=m-3;x1=m+3}if(y1-y0<6){const m=(y0+y1)/2;y0=m-3;y1=m+3}mark=`<rect x="${x0.toFixed(1)}" y="${y0.toFixed(1)}" width="${(x1-x0).toFixed(1)}" height="${(y1-y0).toFixed(1)}" fill="none" stroke="#e2552d" stroke-width="2"/>`}}}
  return `<svg viewBox="0 0 160 82"><rect width="160" height="82" rx="6" fill="#f6f3ec"/><path d="${landWorld}" fill="#8e877b"/>${mark}</svg>`}
function viewCorners(pr,W,H){const pts=[];for(let i=0;i<=4;i++)for(let j=0;j<=4;j++){const q=pr.invert([W*i/4,H*j/4]);if(q&&isFinite(q[0]))pts.push(q)}return pts}

    else if(!ok){fact=`💡 You picked ${esc(pick.n)}. Its centre is about ${fmt(Math.round(dist(pick,ans)/50)*50)} km from the centre of ${esc(ans.n)}.`}
    else{const near=R.opts.filter(o=>o.id!==R.ans).map(o=>BYID[o.id]).sort((a,b)=>dist(a,ans)-dist(b,ans))[0];fact=`💡 ${esc(ans.n)} is a ${kindWord(ans)} in ${ans.cont.map(c=>CONT[c]).join(' and ')}. The nearest other choice was ${esc(near.n)}, about ${fmt(Math.round(dist(near,ans)/50)*50)} km away centre to centre.`}
    const srcl=ans.kind==='lake'?`Figures from ${[...new Set([ans.depth?ans.src.depth:null,ans.area?ans.src.area:null].filter(Boolean))].map(k=>`<a href="${SRC[k][1]}" target="_blank" rel="noopener">${esc(SRC[k][0])}</a>`).join(' and ')}. Outline from <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a>.`
      :`Name and outline from <a href="https://www.naturalearthdata.com/downloads/10m-physical-vectors/10m-geography-regions/" target="_blank" rel="noopener">Natural Earth</a>. Distances are measured on the map, centre to centre.`;
    const vis=ans.kind==='lake'?lakeRow(R):`${resultsMap(R)}<div class="legend"><span><i class="lg t"></i>The answer</span>${ok?'':'<span><i class="lg w"></i>Your pick</span>'}<span><i class="lg o"></i>Other choices</span></div>`;
    cards.push(`<div class="rcard"><div class="rhd"><div><div class="label" style="margin:0">Round ${ri+1} · ${KINDS[ans.kind].one}</div><h3>${esc(ans.n)}</h3></div><div class="rs">${ok?'✓':'✗'}</div></div>
     <div class="rgrid2"><div>${vis}</div><div>${rows}<div class="fact">${fact}</div><div class="srcline">${srcl}</div></div></div></div>`)});
  const total=S.game.length;
  return `<h1>Results</h1><div class="panel"><div class="score"><div class="big">${right}/${total}</div><div><h2>${verdict(right/total)}</h2><div style="color:var(--muted);font-size:14px">Natural Wonders · Bodies of Water · ${esc(WHERE[S.where].t.replace(/^\S+ (?=[A-Z])/,''))} · ${Object.keys(KINDS).filter(k=>S.kinds[k]).map(k=>KINDS[k].t).join(', ')} · ${total} rounds</div></div></div>
  <div class="row" style="margin-top:16px"><button class="btn" onclick="startGame()">Play again</button><button class="btn ghost" onclick="quit()">Change settings</button><button class="btn ghost" onclick="share(${right},${total})">Share score</button><button class="btn ghost" onclick="openSources()">Sources</button></div></div>
  <div class="label" style="margin-top:24px">Round by round</div>${cards.join('')}<p class="foot">Names and outlines come from Natural Earth; lake figures are shown exactly as published by the source named under each round. <button class="srclink" onclick="openSources()">See all sources</button></p>`}
window.share=async(r,n)=>{const t=`Natural Wonders: Bodies of Water. I scored ${r}/${n}. Can you beat me?`;const u=location.href.startsWith('http')?location.href:'';
  try{if(navigator.share){await navigator.share({text:t,url:u||undefined});return}}catch(e){return}
  try{await navigator.clipboard.writeText(t+(u?' '+u:''));toast('Score copied. Paste it to a friend.')}catch(e){toast(t)}};
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),3800)}
function openSources(){let ov=document.getElementById('srcov');if(!ov){ov=document.createElement('div');ov.id='srcov';ov.className='srcov';ov.addEventListener('click',e=>{if(e.target===ov)closeSources()});document.body.appendChild(ov)}
 ov.innerHTML=`<div class="srcbox" role="dialog" aria-label="Sources"><button class="srcx" onclick="closeSources()">Close</button>${sourcesBody()}</div>`;ov.classList.add('open');ov.scrollTop=0}
function closeSources(){const ov=document.getElementById('srcov');if(ov)ov.classList.remove('open')}
addEventListener('keydown',e=>{if(e.key==='Escape')closeSources()});
const RENAMED=[["Inner Seas","Sea of the Hebrides"],["Golfe du Lion","Gulf of Lion"],["Inner Sea","Seto Inland Sea"],["Bo Hai","Bohai Sea"],["Gulf of Khambhät","Gulf of Khambhat"],["Shelikhova Gulf","Shelikhov Gulf"],["Bahía de Campeche","Bay of Campeche"],["Golfo de California","Gulf of California"],["Golfo de Panamá","Gulf of Panama"],["Golfo de Tehuantepec","Gulf of Tehuantepec"],["Yucatan Channel","Yucatán Channel"],["Golfo San Jorge","Gulf of San Jorge"],["Golfo San Matías","Gulf of San Matías"],["Golfo de Guayaquil","Gulf of Guayaquil"],["Golfo de Penas","Gulf of Penas"],["Golfo Corcovado","Gulf of Corcovado"],["Estrecho de Magellanes","Strait of Magellan"],["Gulf St. Vincent","Gulf St Vincent"]];
function sourcesBody(){
  const grp=Object.keys(CONT).map(c=>{const xs=MARINE.filter(m=>m.cont.includes(c)).sort((a,b)=>a.n.localeCompare(b.n));return `<tr><td><b>${CONT[c]}</b></td><td>${xs.map(m=>esc(m.n)).join(', ')}</td></tr>`}).join('');
  const lrows=LAKES.slice().sort((a,b)=>a.n.localeCompare(b.n)).map(l=>`<tr><td>${esc(l.n)}</td><td>${l.cont.map(c=>CONT[c]).join(', ')}</td><td class="n">${l.area?fmt(l.area):'–'}</td><td class="n">${l.depth?fmt(l.depth):'–'}</td></tr>`).join('');
  return `<h2>Sources</h2>
  <p class="gf">The names, outlines and figures in this game were taken in good faith from the published sources below in October 2026, and lake figures are shown exactly as the source gives them. Seas don't have fixed edges in the way countries do: different organisations draw the boundaries differently, and many seas have more than one name. If you think something is wrong, the source named here is where it came from.</p>
  <h3>Seas, gulfs, bays, straits and channels</h3><ul><li>Names and outlines: <a href="https://www.naturalearthdata.com/downloads/10m-physical-vectors/10m-geography-regions/" target="_blank" rel="noopener">Natural Earth, 1:10m Physical Vectors, Geography Regions (marine areas)</a> (public domain). Outlines are simplified for the map.</li>
  <li>The game uses the English name. Where Natural Earth's label is in another language, the English form is used instead: ${RENAMED.map(r=>`${esc(r[0])} → ${esc(r[1])}`).join('; ')}.</li>
  <li>Distances shown in the results are measured on the map between the centres of the two shapes, so they are approximate.</li></ul>
  <h3>Lakes</h3><ul><li>Outlines: <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a> (public domain).</li>${Object.entries(SRC).map(([k,v])=>`<li>Figures: <a href="${v[1]}" target="_blank" rel="noopener">${esc(v[0])}</a></li>`).join('')}</ul>
  <h3>Land</h3><ul><li><a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a> 1:50m land (public domain).</li></ul>
  <h3>How the game stays fair</h3><ul><li>The four wrong answers are always the same kind of water (a sea is never mixed in with lakes) and usually come from the same part of the world, so you can't guess from the type alone.</li><li>Seas and straits that border more than one continent appear under each of them.</li></ul>
  <h3>Everything in the game</h3><details><summary>${MARINE.length} seas, gulfs, bays, straits and channels by continent</summary><table>${grp}</table></details>
  <details><summary>${LAKES.length} lakes · area km² · depth m</summary><table><tr><td><b>Lake</b></td><td><b>Continent</b></td><td class="n"><b>Area</b></td><td class="n"><b>Depth</b></td></tr>${lrows}</table></details>
  <p style="font-size:12px;color:#6f685d;margin-top:14px">Natural Wonders: Bodies of Water ${VERSION}</p>`}
render();
</script>
</body>
